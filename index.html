<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Month to Month</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --table:#0E1830; --table2:#172A52; --felt:#1C3363;
  --card:#F5F7FF; --card2:#E7ECFA; --ink:#121A31; --ink2:#4A5573; --line:#CBD4EC;
  --on-table:#EAF0FF; --on-table2:#A9B8DD;
  --green:#22C47F; --green-d:#0B8350; --yellow:#FFD23F; --coral:#FF6259; --coral-d:#C8283A;
  --sky:#4CC9F0; --violet:#A28CFF; --pink:#FF80B8; --slate:#93A6CC;
  --display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',Verdana,system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
  font-size:16px;
}
:root.big{font-size:19px}
*{box-sizing:border-box}
/* keep tables inheriting text styles even if a host drops the doctype (quirks mode) */
table{color:inherit;font-size:inherit;font-weight:inherit;font-style:inherit;line-height:inherit;font-family:inherit}
/* light surfaces always get dark text, wherever they sit */
.note,.receipt,.stub,.mq,.fixed,.bigtake,.opt,.moodscale,.tile,.panel{color:var(--ink)}
html,body{min-height:100%}
body{
  margin:0; padding-inline:16px; padding-block:0 120px;
  font-family:var(--body); font-size:1rem; line-height:1.55; color:var(--on-table);
  background-color:var(--table);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, var(--felt) 0%, transparent 70%),
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.055) 1px, transparent 0);
  background-size:auto, 22px 22px;
}
.wrap{max-width:900px; margin:0 auto}
h1,h2,h3{font-family:var(--display); line-height:1.08; text-wrap:balance; margin:0}
p{margin:0}
button{font:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--yellow); outline-offset:3px; border-radius:8px}

/* header */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:18px 10px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:800; font-size:1.15rem; letter-spacing:-.01em}
.brand .coin{width:30px; height:30px; border-radius:50%; background:var(--yellow); color:var(--ink); display:grid; place-items:center; font-size:.95rem; box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.tools{display:flex; gap:8px; flex-wrap:wrap}
.tool{display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0 12px; border-radius:999px; border:2px solid rgba(255,255,255,.18); background:rgba(255,255,255,.05); color:var(--on-table); font-size:.9rem; font-weight:700}
.tool:hover{background:rgba(255,255,255,.12)}
.tool[aria-pressed="true"]{background:var(--yellow); color:var(--ink); border-color:var(--yellow)}
.tool svg{width:18px; height:18px}

/* board progress */
.boardwrap{overflow-x:auto; padding-block:6px 14px; margin-bottom:8px}
.board{list-style:none; margin:0; padding:0; display:flex; min-width:860px}
.space{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; position:relative; font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--on-table2)}
.space::before{content:""; position:absolute; top:15px; left:-50%; width:100%; height:4px; background:rgba(255,255,255,.12); z-index:0}
.space:first-child::before{display:none}
.space.done::before,.space.here::before{background:var(--green)}
.dot{width:34px; height:34px; border-radius:50%; background:var(--table2); border:3px solid rgba(255,255,255,.2); display:grid; place-items:center; z-index:1; font-family:var(--display); font-size:.8rem; color:var(--on-table2)}
.space.done .dot{background:var(--green); border-color:var(--green); color:var(--ink)}
.space.here .dot{background:var(--yellow); border-color:#fff; color:var(--ink); transform:scale(1.18); box-shadow:0 0 0 6px rgba(255,210,63,.22)}
.space.here{color:var(--yellow)}

/* panels */
.panel{background:var(--card); color:var(--ink); border-radius:22px; padding:clamp(18px,4vw,32px); box-shadow:0 10px 0 rgba(0,0,0,.28); position:relative}
.stack{display:flex; flex-direction:column; gap:18px}
.eyebrow{font-size:.78rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink2)}
.on-table .eyebrow,.eyebrow.lt{color:var(--on-table2)}
.lead{font-size:1.1rem; color:var(--ink2); max-width:60ch}
.h-screen{font-size:clamp(1.8rem,5vw,2.6rem); font-weight:800; letter-spacing:-.02em}
.screen-head{display:flex; flex-direction:column; gap:8px; margin-bottom:18px}
.screen-head .lead{color:var(--on-table2)}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:0 24px; border-radius:14px; border:3px solid var(--ink); background:var(--green); color:var(--ink); font-weight:700; font-size:1.05rem; box-shadow:0 5px 0 var(--ink); transition:transform .08s, box-shadow .08s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn.ghost{background:var(--card); }
.btn.yellow{background:var(--yellow)}
.btn.coral{background:var(--coral); color:#fff}
.btn.small{min-height:42px; padding:0 16px; font-size:.95rem; box-shadow:0 3px 0 var(--ink)}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.row.end{justify-content:flex-end}
.btn svg{width:20px; height:20px}

/* start */
.hero{display:grid; grid-template-columns:1.1fr .9fr; gap:28px; align-items:center; padding-block:18px 8px}
.hero h1{font-size:clamp(2.8rem,9vw,5.4rem); font-weight:800; letter-spacing:-.035em; line-height:.92}
.hero h1 span{color:var(--yellow); display:block}
.hero .lead{color:var(--on-table2); margin-top:16px; font-size:1.2rem}
.fan{position:relative; height:280px}
.mini{position:absolute; width:190px; height:250px; border-radius:18px; border:3px solid var(--ink); padding:16px; color:var(--ink); display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 10px 0 rgba(0,0,0,.3)}
.mini .k{font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase}
.mini .v{font-family:var(--display); font-weight:800; font-size:2rem; line-height:1}
.mini .t{font-weight:700; font-size:1.05rem}
.mini svg{width:40px; height:40px}
.mini.a{background:var(--sky); left:4%; top:22px; transform:rotate(-12deg)}
.mini.b{background:var(--coral); left:30%; top:4px; transform:rotate(2deg); color:#fff; z-index:1}
.mini.b .k,.mini.b .t{color:#fff}
.mini.c{background:var(--yellow); left:54%; top:30px; transform:rotate(13deg); z-index:2}
@media (prefers-reduced-motion:no-preference){
  .mini.a{animation:bob 5s ease-in-out infinite}
  .mini.b{animation:bob 5s ease-in-out -1.6s infinite}
  .mini.c{animation:bob 5s ease-in-out -3.2s infinite}
}
@keyframes bob{50%{translate:0 -8px}}
.steps3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.step3{background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.12); border-radius:16px; padding:16px; display:flex; gap:12px; align-items:flex-start}
.step3 b{font-family:var(--display); font-size:1.6rem; color:var(--yellow); line-height:1}
.step3 p{color:var(--on-table2); font-size:.95rem}
.step3 strong{color:var(--on-table); display:block; font-size:1.02rem}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-weight:700}
.txt{min-height:52px; border-radius:12px; border:3px solid var(--ink); padding:0 14px; font:inherit; font-size:1.1rem; background:#fff; color:var(--ink); width:100%; color-scheme:light}
textarea.txt{min-height:96px; padding:12px 14px; resize:vertical}
details.teacher{margin-top:18px; color:var(--on-table2); font-size:.92rem; max-width:70ch}
details.teacher summary{cursor:pointer; font-weight:700; color:var(--on-table)}
details.teacher ul{padding-left:1.2em; margin:8px 0 0}

/* choice cards */
.choices{display:grid; gap:14px}
.choices.c3{grid-template-columns:repeat(3,1fr)}
.choices.c4{grid-template-columns:repeat(4,1fr)}
.pick.pg{border-color:var(--coral)}
.pick[disabled]{opacity:.5; cursor:not-allowed; transform:none}
@media (max-width:1000px){.choices.c4{grid-template-columns:1fr 1fr}}
.pick{all:unset; box-sizing:border-box; cursor:pointer; background:var(--card); color:var(--ink); border:3px solid var(--line); border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:10px; box-shadow:0 6px 0 rgba(0,0,0,.25); transition:transform .12s, border-color .12s}
.pick:hover{transform:translateY(-3px)}
.pick:focus-visible{outline:3px solid var(--yellow); outline-offset:3px}
.pick[aria-checked="true"]{border-color:var(--ink); box-shadow:0 6px 0 var(--ink), 0 0 0 5px var(--yellow)}
.pick .badge{width:52px; height:52px; border-radius:14px; display:grid; place-items:center; border:3px solid var(--ink)}
.pick .badge svg{width:28px; height:28px}
.pick h3{font-size:1.3rem}
.pick .meta{display:flex; flex-direction:column; gap:4px; font-size:.95rem; color:var(--ink2); border-top:2px dashed var(--line); padding-top:10px; margin-top:auto}
.pick .meta b{color:var(--ink)}

/* flip cards */
/* 2D flip (no 3D/backface tricks): works in phone browsers and Google Sites embeds */
.flip{width:min(320px,100%); height:430px; margin:0 auto; position:relative}
.flip .inner{position:absolute; inset:0; transition:transform .28s ease-in}
.flip.turning .inner{transform:scaleX(0)}
.flip .face.front{visibility:hidden}
.flip.flipped .face.front{visibility:visible}
.flip.flipped .face.back{visibility:hidden}
.face{position:absolute; top:0; left:0; right:0; bottom:0; border-radius:22px; border:4px solid var(--ink); box-shadow:0 12px 0 rgba(0,0,0,.3); overflow:hidden}
.face.back{background:var(--violet); display:grid; place-items:center;
  background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 12px, transparent 12px 24px)}
.face.back .seal{width:62%; aspect-ratio:1; border-radius:50%; background:var(--yellow); border:4px solid var(--ink); display:grid; place-items:center; text-align:center; font-family:var(--display); font-weight:800; font-size:1.5rem; line-height:.95; color:var(--ink); padding:10px}
@supports not (aspect-ratio:1){.face.back .seal{height:190px}}
.face.front{background:var(--card); color:var(--ink); display:flex; flex-direction:column}
.face.front .band{padding:18px; display:flex; justify-content:space-between; align-items:flex-start; border-bottom:4px solid var(--ink)}
.face.front .band svg{width:54px; height:54px}
.face.front .body{padding:18px; display:flex; flex-direction:column; gap:10px; flex:1}
.face.front h3{font-size:1.55rem}
.face.front .big{font-family:var(--display); font-weight:800; font-size:2.4rem; line-height:1; margin-top:auto}
.face.front .sub{color:var(--ink2); font-size:.95rem}
@media (prefers-reduced-motion:reduce){.flip .inner{transition:none}}
.flipzone{display:grid; grid-template-columns:minmax(0,340px) minmax(0,1fr); gap:28px; align-items:center}

/* pay stub */
.stub{font-family:var(--mono); background:#fff; border:3px solid var(--ink); border-radius:14px; overflow:hidden}
.stub .hd{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:12px 16px; background:var(--ink); color:#fff; font-size:.82rem; letter-spacing:.06em; text-transform:uppercase}
.stub table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
.stub td{padding:10px 16px; border-bottom:1px dashed var(--line)}
.stub td:last-child{text-align:right; font-weight:500}
.stub td .pct{color:var(--ink2); font-size:.85rem}
.stub tr.q td{background:#FFF6D1}

/* math question */
.mq{background:var(--card2); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:10px; border:3px solid transparent}
.mq.ok{background:#DDF7EA; border-color:var(--green-d)}
.mq label{font-weight:700; font-size:1.08rem}
.mq .formula{font-family:var(--mono); font-size:.95rem; background:#fff; border-radius:10px; padding:8px 12px; border:2px solid var(--line); align-self:flex-start}
.mq-row{display:flex; gap:10px; flex-wrap:wrap; align-items:stretch}
.money-in{display:flex; align-items:center; background:#fff; border:3px solid var(--ink); border-radius:12px; padding-left:12px; flex:1 1 180px; max-width:280px}
.money-in span{font-family:var(--mono); font-size:1.3rem; color:var(--ink2)}
.money-in input{all:unset; flex:1; min-width:0; min-height:48px; padding:0 10px; font-family:var(--mono); font-size:1.3rem; color:var(--ink); font-variant-numeric:tabular-nums}
.money-in:focus-within{outline:3px solid var(--yellow); outline-offset:2px}
.mq.ok .money-in{border-color:var(--green-d); background:#F4FFF9}
.fb{font-weight:700; min-height:1.5em}
.fb.bad{color:var(--coral-d)}
.fb.good{color:var(--green-d)}
.howto summary{cursor:pointer; font-weight:700; color:var(--ink2); display:flex; gap:6px; align-items:center; list-style:none; width:max-content}
.howto summary::-webkit-details-marker{display:none}
.howto summary svg{width:20px; height:20px; flex:none}
.howto ol{margin:8px 0 0; padding-left:1.3em; display:flex; flex-direction:column; gap:4px}
.howto code,.kbd{font-family:var(--mono); background:#fff; border:2px solid var(--line); border-bottom-width:3px; border-radius:6px; padding:0 6px; font-size:.9em; white-space:nowrap}
.reveal{all:unset; cursor:pointer; color:var(--ink2); text-decoration:underline; font-weight:700; font-size:.95rem}

.bigtake{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; background:var(--green); border:3px solid var(--ink); border-radius:18px; padding:18px 20px}
.bigtake .v{font-family:var(--display); font-weight:800; font-size:clamp(2rem,6vw,2.8rem); line-height:1}
.note{display:flex; gap:12px; align-items:flex-start; background:#FFF6D1; border:3px solid var(--ink); border-radius:14px; padding:14px 16px}
.note.bad{background:#FFE1E1}
.note svg{flex:none; width:26px; height:26px; margin-top:1px}

/* budget */
.cat{display:flex; flex-direction:column; gap:12px}
.cat-hd{display:flex; align-items:center; gap:12px}
.cat-hd .ic{width:44px; height:44px; border-radius:12px; border:3px solid var(--ink); display:grid; place-items:center; flex:none}
.cat-hd .ic svg{width:24px; height:24px}
.cat-hd h3{font-size:1.35rem}
.cat-hd p{color:var(--ink2); font-size:.95rem}
.opts{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px}
.opt{all:unset; box-sizing:border-box; cursor:pointer; border:3px solid var(--line); background:#fff; border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:4px; transition:border-color .1s, transform .1s}
.opt:hover{border-color:var(--ink2)}
.opt:focus-visible{outline:3px solid var(--yellow); outline-offset:2px}
.opt[aria-checked="true"]{border-color:var(--ink); background:var(--sel,#FFF6D1); box-shadow:0 4px 0 var(--ink); transform:translateY(-2px)}
.opt .l{font-weight:700; line-height:1.25}
.opt .d{font-size:.88rem; color:var(--ink2); line-height:1.35}
.opt .foot{display:flex; justify-content:space-between; align-items:center; margin-top:6px; gap:8px}
.opt .c{font-family:var(--mono); font-weight:500; font-size:1.05rem}
.hap{display:inline-flex; gap:3px; align-items:center}
.hap i{width:9px; height:9px; border-radius:50%; background:var(--line); display:block}
.hap i.on{background:var(--pink); box-shadow:inset 0 0 0 1.5px var(--ink)}
.tags{display:flex; gap:6px; flex-wrap:wrap}
.tag{font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:2px 8px; border-radius:999px; border:2px solid var(--ink)}
.tag.need{background:var(--sky)}
.tag.want{background:var(--pink)}
.tag.lux{background:linear-gradient(135deg,#FFE27A,#E0A800); color:var(--ink)}
.opt.lux{grid-column:1/-1; border-color:#E0B300; background:linear-gradient(160deg,#FFFBEA 0%,#fff 55%); padding-right:38%}
.opt.lux .art{width:34%; right:0; bottom:-8px}
@media (max-width:520px){.opt.lux{padding-right:14px}.opt.lux .art{width:60%}}
.opt.lux .l{font-family:var(--display); font-size:1.08rem}
.opt.lux[aria-checked="true"]{background:#FFF1B8}
.fixed{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; border:3px dashed var(--ink2); border-radius:14px; padding:12px 16px; background:#fff}
.sticky-net{position:sticky; top:calc(env(safe-area-inset-top,0px) + 8px); z-index:5; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; background:var(--ink); color:#fff; border-radius:14px; padding:10px 16px; border:2px solid rgba(255,255,255,.2)}
.sticky-net b{font-family:var(--mono); color:var(--green); font-size:1.15rem}

/* receipt */
.receipt{font-family:var(--mono); background:#fff; border:3px solid var(--ink); border-radius:14px; padding:6px 0; font-variant-numeric:tabular-nums}
.receipt .ln{display:flex; justify-content:space-between; gap:10px; padding:8px 16px; border-bottom:1px dashed var(--line)}
.receipt .ln:last-child{border-bottom:0}
.receipt .ln span:first-child{display:flex; gap:10px; align-items:center}
.sw{width:12px; height:12px; border-radius:3px; border:2px solid var(--ink); display:inline-block; flex:none}

/* 50/30/20 */
.split{display:grid; grid-template-columns:220px 1fr; gap:24px; align-items:center}
.donut{width:100%; max-width:220px; aspect-ratio:1}
.bars{display:flex; flex-direction:column; gap:16px}
.bar-l{display:flex; justify-content:space-between; font-weight:700; gap:10px}
.bar-l span:last-child{font-family:var(--mono); font-weight:500}
.track{position:relative; height:22px; border-radius:999px; background:var(--card2); border:2px solid var(--ink); overflow:visible}
.fill{height:100%; border-radius:999px; max-width:100%}
.target{position:absolute; top:-6px; bottom:-6px; width:3px; background:var(--ink); border-radius:2px}
.target::after{content:attr(data-t); position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-size:.72rem; font-weight:700; white-space:nowrap}
.bar-note{font-size:.9rem; color:var(--ink2)}

/* month */
.hud{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px}
.hudc{background:var(--table2); border:2px solid rgba(255,255,255,.14); border-radius:16px; padding:12px 14px; display:flex; gap:12px; align-items:center}
.hudc .ic{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; flex:none; color:var(--ink)}
.hudc .ic svg{width:22px; height:22px}
.hudc .k{font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--on-table2)}
.hudc .v{font-family:var(--display); font-weight:800; font-size:1.5rem; line-height:1.1}
.hudc.debt .v{color:var(--coral)}
.payday{display:flex; flex-direction:column; gap:6px}
.payday .ln{display:flex; justify-content:space-between; gap:10px; font-family:var(--mono); font-variant-numeric:tabular-nums; padding:8px 0; border-bottom:1px dashed var(--line)}
.payday .ln:last-child{border-bottom:0}
.ev-pos .band{background:var(--green)}
.ev-neg .band{background:var(--coral); color:#fff}
.ev-choice .band{background:var(--yellow)}
.ev-stress .band{background:#6B7A99; color:#fff}
.hudc.mood .av{flex:none; display:grid}
.moodfx{display:flex; gap:8px; align-items:center; margin:-8px 0 16px; color:var(--on-table2); font-size:.95rem}
.moodfx b{color:var(--on-table)}
.moodscale{border:3px solid var(--ink); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:14px; background:#fff}
.ms-now{display:flex; gap:14px; align-items:center}
.ms-row{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.ms{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px; border-radius:12px; font-size:.82rem; text-align:center}
.ms span{color:var(--ink2); font-size:.75rem}
.ms.on{background:#FFF1B8; box-shadow:inset 0 0 0 2px var(--ink)}
@media (max-width:620px){.ms-row{grid-template-columns:repeat(4,1fr)}}
.band .kind{font-size:.78rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase}
.speak{all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-size:.88rem; font-weight:700; color:var(--ink2)}
.speak svg{width:18px; height:18px}

/* results */
.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
.tile{background:var(--card); color:var(--ink); border-radius:18px; padding:16px; border:3px solid var(--ink); box-shadow:0 6px 0 rgba(0,0,0,.28)}
.tile .k{font-size:.74rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2)}

const art=(id,cls)=>ART[id]?`<svg class="art ${cls||''}" viewBox="0 0 200 120" fill="currentColor" aria-hidden="true" focusable="false">${ART[id]}</svg>`:'';

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const NM=12;

/* ---------- state ---------- */
const KEY='month-to-month-v1';
const fresh=()=>({step:'start',name:'',path:null,career:null,choices:{},solved:{},tries:{},helped:{},month:1,savings:0,debt:0,eventHap:0,stressHap:0,deck:[],months:{},log:[],reflect:{},confetti:false,loanId:null,extraMonthly:0});
let S=fresh();
try{const raw=localStorage.getItem(KEY); if(raw){const o=JSON.parse(raw); if(o&&o.step) S=Object.assign(fresh(),o);}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let hadSave = S.step!=='start';
let flipNow=null; // transient: which card should animate

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>{n=Math.round(n); return (n<0?'\u2212$':'$')+Math.abs(n).toLocaleString('en-US');};
const plain=n=>Math.round(n).toLocaleString('en-US');
const shuffle=a=>{a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;};
const career=()=>S.career?CAREERS[S.path].find(c=>c.id===S.career):null;
const gross=()=>career().salary/12;
const fedRate=()=>{const y=career().salary; return y<60000?.10:y<120000?.14:.22;};
const deductions=()=>{const g=gross(); return [
  {k:'Federal income tax',p:Math.round(fedRate()*100)+'%',v:Math.round(g*fedRate())},
  {k:'Georgia state tax',p:'5%',v:Math.round(g*.05)},
  {k:'Social Security',p:'6.2%',v:Math.round(g*.062)},
  {k:'Medicare',p:'1.45%',v:Math.round(g*.0145)},
  {k:'Health insurance',p:'flat fee',v:180}];};
const dedTotal=()=>deductions().reduce((a,d)=>a+d.v,0);
const net=()=>gross()-dedTotal();
const loanCard=()=>{if(!S.loanId||!LOANS[S.path]) return null; const l=LOANS[S.path].find(x=>x.id===S.loanId); if(!l) return null; if(S.path!=='postgrad') return l; const c=career(); return Object.assign({},l,{debt:Math.round(c.debt*l.mult/1000)*1000,pay:Math.round(c.pay*l.mult/50)*50});};
const schoolDebt=()=>S.path==='postgrad'&&career()?career().years*3500:0;
const loan=()=>{const l=loanCard(); return l?l.pay:0;};
const utilities=()=>S.choices.housing&&S.choices.housing!=='family'?150:0;
const opt=cid=>{const c=CATS.find(x=>x.id===cid); return c.opts.find(o=>o.id===S.choices[cid]);};
const expenseLines=()=>{const l=CATS.map(c=>({name:c.name+': '+opt(c.id).label,v:opt(c.id).cost,color:c.color})); if(utilities()) l.splice(1,0,{name:'Utilities + internet',v:utilities(),color:'var(--sky)'}); if(loan()) l.push({name:'Student loan payment',v:loan(),color:'var(--slate)'}); return l;};
const expTotal=()=>expenseLines().reduce((a,x)=>a+x.v,0);
const leftover=()=>net()-expTotal();
const needs=()=>CATS.reduce((a,c)=>a+opt(c.id).need,0)+loan()+utilities();
const wants=()=>CATS.reduce((a,c)=>a+opt(c.id).cost-opt(c.id).need,0);
const baseHap=()=>CATS.reduce((a,c)=>a+(S.choices[c.id]?opt(c.id).hap:0),0);
const happiness=()=>baseHap()+S.eventHap+S.stressHap;

const parseNum=v=>{v=String(v).replace(/[$,\s]/g,'').replace(/[\u2212\u2013\u2014]/g,'-'); if(v===''||v==='-'||isNaN(+v)) return NaN; return +v;};
const hapDots=(n,max)=>`<span class="hap" aria-label="${n} happiness points">${Array.from({length:max||8},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</span>`;

/* ---------- math questions ---------- */
let MQ={};
function mq(key,label,answer,steps,formula){
  MQ[key]={answer};
  const done=S.solved[key]!==undefined;
  const tries=S.tries[key]||0;
  return `<div class="mq ${done?'ok':''}" data-key="${key}">
    <label for="in-${key}">${label}</label>
    ${formula?`<div class="formula">${formula}</div>`:''}
    <div class="mq-row">
      <div class="money-in"><span aria-hidden="true">$</span><input id="in-${key}" class="answer" inputmode="decimal" autocomplete="off" aria-describedby="fb-${key}" ${done?`value="${plain(S.solved[key]).replace(/,/g,'')}" disabled`:''}></div>
      ${done?'':`<button class="btn small check" type="button" data-key="${key}">${ic('check',2.6)}Check</button>`}
    </div>
    <div class="fb ${done?'good':''}" id="fb-${key}" aria-live="polite">${done?(S.helped[key]?'Here is the answer. Look at the steps so you can do the next one.':'Correct! Nice work.'):''}${!done&&tries>=2?revealBtn(key):''}</div>
    ${done?'':`<details class="howto"><summary>${ic('bulb')} Show me how</summary><ol>${steps.map(s=>`<li>${s}</li>`).join('')}</ol></details>`}
  </div>`;
}
const revealBtn=k=>` <button class="reveal" type="button" data-reveal="${k}">Show me the answer</button>`;
function checkMQ(key){
  const q=MQ[key]; if(!q) return;
  const inp=document.getElementById('in-'+key), fb=document.getElementById('fb-'+key);
  const v=parseNum(inp.value);
  if(isNaN(v)){fb.className='fb bad'; fb.innerHTML='Type a number, like 1250.'; inp.focus(); return;}
  if(Math.abs(v-q.answer)<=1){
    S.solved[key]=q.answer; if(AFTER[key]) AFTER[key](); render({focusNext:true}); return;
  }
  S.tries[key]=(S.tries[key]||0)+1; save();
  const t=S.tries[key];
  const dir=v>q.answer?'too high':'too low';
  fb.className='fb bad';
  fb.innerHTML=`Not quite. Your answer is ${dir}. ${t===1?'Try again, or open \u201CShow me how.\u201D':'Check each step with the calculator.'}${t>=2?revealBtn(key):''}`;
  inp.select();
}

function spaceIdx(){if(midActive()&&['budget','bmath','review'].includes(S.step)) return 10; return {start:0,path:1,career:2,loan:2,pay:3,budget:4,bmath:4,review:4,midyear:10,month:4+S.month,results:5+NM}[S.step]||0;}
function drawBoard(){

  $('#board').innerHTML=SPACES.map((s,k)=>`<li class="space ${k<i?'done':k===i?'here':''}" ${k===i?'aria-current="step"':''}><span class="dot">${k<i?'\u2713':k>=5&&k<5+NM?k-4:k===5+NM?'\u2605':''}</span>${s}</li>`).join('');
}

/* ---------- mid-year review ---------- */
const midActive=()=>!!(S.mid&&S.mid.active);
const SALE={bus:0,oldcar:2000,used:1500,new:-1500,sports:-4000};
const BUY={bus:0,oldcar:-3500,used:-1500,new:-3000,sports:-7000};
function changeCost(cat,from,to){
  if(from===to) return 0;
  if(cat==='housing') return (from==='family'||to==='family')?-250:-600;
  if(cat==='transport') return SALE[from]+BUY[to];
  if(cat==='phone') return (['premium','gadgets'].includes(to)&&!['premium','gadgets'].includes(from))?-300:0;
  return 0;
}
const changeWhy=(cat,from,to)=>{
  if(cat==='housing') return (from==='family'||to==='family')?'moving truck and supplies':'movers, deposit and lease-break fee';
  if(cat==='transport'){ const p=[]; if(SALE[from]>0) p.push('you sell your car for '+money(SALE[from])); if(SALE[from]<0) p.push('you owe '+money(-SALE[from])+' more than your car is worth'); if(BUY[to]<0) p.push((to==='oldcar'?'you pay ':'down payment ')+money(-BUY[to])); return p.join(', '); }
  if(cat==='phone') return 'new phone down payment';
  return '';
};
function midChanges(){
  if(!S.mid) return [];
  return CATS.filter(c=>S.mid.orig[c.id]!==S.choices[c.id]).map(c=>{const f=c.opts.find(o=>o.id===S.mid.orig[c.id]), t=opt(c.id); return {cat:c.id,name:c.name,from:f.label,to:t.label,cost:changeCost(c.id,f.id,t.id),why:changeWhy(c.id,f.id,t.id)};});
}
const midTotal=()=>midChanges().reduce((a,x)=>a+x.cost,0);
function projection(){ const per=leftover()-(S.monthly||[]).reduce((a,x)=>a+x.v,0); return {per,end:S.savings-S.debt+per*(NM-6)}; }
SCREENS.midyear=()=>{
  const pr=projection(), h=happiness(), exp=expTotal();
  const status=pr.end<0?{c:'bad',t:'Warning: you are on track to end the year in debt.',tip:'Think about cheaper choices: move somewhere cheaper, sell your car and take the bus, or cook at home.'}
    :S.debt>0?{c:'bad',t:'You still owe money on your credit card.',tip:'Paying it off stops the 2% interest. A cheaper budget would clear it faster.'}
    :pr.end>exp*4?{c:'',t:'You are doing great!',tip:'You have room to upgrade something if you want. Just remember that bigger costs every month mean less cushion for surprises.'}

  return `<div class="screen-head"><p class="eyebrow lt">End of June \u00B7 Mid-year check-in</p><h2 class="h-screen">Halfway there, ${esc(S.name)}!</h2><p class="lead">Six months down, six to go. Is your budget working?</p></div>
  <div class="hud">

    <div class="hudc ${S.debt>0?'debt':''}"><span class="ic" style="background:var(--coral)">${ic('card')}</span><div><div class="k">Credit card</div><div class="v">${money(S.debt)}</div></div></div>
    <div class="hudc mood"><span class="av">${avatar(h,46)}</span><div><div class="k">Mood \u00B7 ${h} pts</div><div class="v">${moodOf(h).name}</div></div></div>
  </div>
  <div class="panel stack">
    <div class="receipt">
      <div class="ln"><span>What you have now (savings \u2212 credit card)</span><span>${money(S.savings-S.debt)}</span></div>
      <div class="ln"><span>6 more paydays \u00D7 ${money(pr.per)} left over</span><span>${pr.per<0?'\u2212':'+'}${money(Math.abs(pr.per*6))}</span></div>
      <div class="ln" style="background:${pr.end<0?'#FFE1E1':'#DDF7EA'}"><span><b>By December, if nothing changes</b></span><span><b>about ${money(pr.end)}</b></span></div>
    </div>
    <p style="color:var(--ink2);font-size:.92rem">This guess does not include surprise cards or choices. Those can change it a lot.</p>
    <div class="note ${status.c}">${ic(status.c?'alert':'bulb')}<div><b>${status.t}</b> ${status.tip}</div></div>
    <div class="note" style="background:#fff">${ic('bulb')}<div><b>Changing costs money one time.</b> Moving costs $250 to $600. Selling a car gets you cash, unless you owe more than it is worth. Buying a car needs a down payment.</div></div>
    <div class="row"><button class="btn ghost" id="keep" type="button">Keep my budget</button><button class="btn yellow" id="change" type="button">Change my budget ${ic('arrow',2.5)}</button></div>

SCREENS.midyear.bind=()=>{
  $('#keep').onclick=()=>{S.mid={active:false,done:true,changed:false,orig:Object.assign({},S.choices)}; S.month=7; S.step='month'; render();};
  $('#change').onclick=()=>{S.mid={active:true,done:false,orig:Object.assign({},S.choices)}; ['e2','l2'].forEach(k=>{delete S.solved[k]; S.tries[k]=0;}); S.step='budget'; render();};
};
function finishMid(){
  const ch=midChanges(), total=midTotal();
  /* drop monthly items tied to what you changed */
  const drop={housing:['Rent increase'],transport:['Car insurance increase','Bigger car payment']};
  ch.forEach(x=>{ if(drop[x.cat]) S.monthly=(S.monthly||[]).filter(it=>!drop[x.cat].includes(it.t)); });
  S.extraMonthly=(S.monthly||[]).reduce((a,x)=>a+x.v,0);
  if(total){ S.savings+=total; if(S.savings<0){S.debt+=-S.savings; S.savings=0;} }
  S.log.push({m:6,slot:2,kind:'mid',title:'Mid-year budget change',amt:total,choice:null,savings:S.savings,debt:S.debt,hap:happiness()});
  /* make the rest of the deck fit your new life */
  const ok=e=>!e.when||WHEN[e.when]();
  for(let k=6;k<NM;k++){ const d=S.deck[k];
    if(d[0]){const e=EVENTS.find(x=>x.id===d[0]); if(e&&!ok(e)) d[0]=null;}
    const c=EVENTS.find(x=>x.id===d[1]); if(c&&!c.season&&!ok(c)) d[1]=pickEvent('choice'); }
  EVENTS.filter(e=>e.kind==='bad'&&e.when&&['sports','baller','penthouse','dining'].includes(e.when)&&WHEN[e.when]()&&!(S.used||[]).includes(e.id)).forEach(e=>{
    if(Math.random()<.75){ const free=[]; for(let k=7;k<NM;k++) if(!S.deck[k][0]) free.push(k); if(free.length){ S.deck[free[Math.floor(Math.random()*free.length)]][0]=e.id; S.used.push(e.id);} }
  });
  S.mid={active:false,done:true,changed:true,orig:S.mid.orig,changes:ch,total};
  S.month=7; S.step='month'; render();
}
SCREENS.review.bind=()=>{
  $('#back').onclick=()=>{S.step='budget'; render();};
  $('#next').onclick=()=>{
    if(midActive()){ finishMid(); return; }
    S.used=[];
    const deck=[];
    for(let m=1;m<=NM;m++){
      const seasonal=EVENTS.find(e=>e.season===m);
      deck.push([m===1?'movein':null, seasonal?seasonal.id:pickEvent('choice')]);
    }
    /* luxury choices bring their own trouble: usually slip their cards into a chance slot */
    EVENTS.filter(e=>e.kind==='bad'&&e.when&&['sports','baller','penthouse','dining'].includes(e.when)&&WHEN[e.when]()).forEach(e=>{
      if(Math.random()<.75){let m; do{m=1+Math.floor(Math.random()*(NM-1));}while(deck[m][0]); deck[m][0]=e.id; S.used.push(e.id);}
    });
    S.deck=deck;
    S.month=1; S.savings=0; S.debt=0; S.eventHap=0; S.stressHap=0; S.months={}; S.log=[]; S.extraMonthly=0; S.monthly=[]; S.invested=0; S.badStreak=0; S.bigCount=0; S.lastBig=-9; S.debt=schoolDebt();
    Object.keys(S.solved).forEach(k=>{if(/^m\d/.test(k)) delete S.solved[k];});
    S.step='month'; render();
  };
};

function enterMonth(m){
  if(S.months[m]) return S.months[m];
  const base=leftover(), items=(S.monthly||[]).slice(), extra=items.reduce((a,x)=>a+x.v,0), dep=base-extra;

function pickEvent(kind,filt){
  const ok=e=>e.kind===kind&&!e.season&&(!e.when||WHEN[e.when]());
  let seen=[]; try{seen=JSON.parse(localStorage.getItem(KEY+'-seenev')||'[]');}catch(e){}
  let pool=EVENTS.filter(ok); const used=S.used||(S.used=[]);
  if(filt){ pool=pool.filter(filt); if(!pool.filter(e=>!used.includes(e.id)).length) return null; }
  let cands=pool.filter(e=>!used.includes(e.id)&&!seen.includes(e.id));
  if(!cands.length){ seen=seen.filter(id=>!pool.some(e=>e.id===id)); cands=pool.filter(e=>!used.includes(e.id)); }
  if(!cands.length) cands=pool;
  const e=shuffle(cands)[0]; used.push(e.id); seen.push(e.id);

function drawChance(){
  if((S.badStreak||0)>=3) return pickEvent('good');

  if(m.lvl<=-2&&Math.random()<(m.lvl<=-3?.5:.3)) return pickEvent('stress');
  if(Math.random()<m.good) return pickEvent('good');
  /* bad luck comes in sizes. Good moods mostly get small annoyances; big disasters are capped. */
  const W={3:[.72,.24,.04],2:[.70,.25,.05],1:[.62,.30,.08],0:[.52,.33,.15],'-1':[.45,.35,.20],'-2':[.35,.37,.28],'-3':[.35,.37,.28]}[m.lvl];
  const r=Math.random(); let size=r<W[0]?0:r<W[0]+W[1]?1:2;

  const f=inc(), sizeOf=e=>{const a=Math.abs(val(e.amt)); return a<=160*f?0:a>=700*f?2:1;};

    const id=pickEvent('bad',e=>sizeOf(e)===sz);

      ['Student loan',l?`${esc(l.title)}: ${money(l.debt)} borrowed, ${money(l.pay)} a month`:'None'],
      ...(schoolDebt()?[['Extra years of school',`${c.years} years (started working at age ${22+c.years})`],['Credit card debt from school',money(schoolDebt())]]:[])])}</div>
    <div class="rsec"><h2>2. My paycheck</h2>${tbl([['Monthly gross pay (salary \u00F7 12)',money(gross())],...deductions().map(d=>[`\u2212 ${d.k} (${d.p})`,money(d.v)]),['<b>Total deductions</b>',`<b>${money(dedTotal())}</b>`],['<b>Take-home pay</b>',`<b>${money(nt)}</b>`]])}</div>
    <div class="rsec"><h2>3. My monthly budget</h2>${tbl([...expenseLines().map(x=>[esc(x.name),money(x.v)]),['<b>Total expenses</b>',`<b>${money(expTotal())}</b>`],['<b>Left over for savings each month</b>',`<b>${money(leftover())}</b>`]])}
      <p class="rnote"><b>50 / 30 / 20 check:</b> Needs ${pct(needs())} (goal 50%) \u00B7 Wants ${pct(wants())} (goal 30%) \u00B7 Savings ${pct(leftover())} (goal 20%)</p></div>
    <div class="rsec"><h2>4. My year in numbers</h2>
      <div class="rtiles"><div><span>Savings</span><b>${money(S.savings)}</b></div><div><span>Investments</span><b>${money(inv)}</b></div><div><span>Credit card owed</span><b class="${S.debt?'neg':''}">${money(S.debt)}</b></div><div><span>Net worth</span><b>${money(nw)}</b></div></div>
      ${tbl([['Good luck cards (money in)',`<b class="pos">+${money(chanceIn)}</b>`],['Bad luck cards (money out)',`<b class="neg">${money(chanceOut)}</b>`],[`Choices: said yes ${yes} of ${said.length} times`,`<b class="neg">${money(chSpent)}</b> spent${chEarn?`, <b class="pos">+${money(chEarn)}</b> earned`:''}`],['Mid-year budget change',S.mid&&S.mid.changed&&S.mid.changes.length?S.mid.changes.map(x=>`${esc(x.name)}: ${esc(x.from)} \u2192 ${esc(x.to)}`).join('<br>')+(S.mid.total?`<br>One-time cost: <b class="${S.mid.total<0?'neg':'pos'}">${S.mid.total>0?'+':''}${money(S.mid.total)}</b>`:''):'Kept the same budget'],['Math right on the first try',`${bl.firstTry} of ${bl.total}`],['Badges earned',bl.list.filter(x=>x[1]).map(x=>x[0]).join(', ')||'None']])}</div>
    <div class="rsec"><h2>5. Month by month</h2>${monthsTable(0,6)}</div>
    <div class="rsec">${monthsTable(6,12)}</div>
    <div class="rsec"><h2>6. My reflection</h2>
      ${[['r1','What was the hardest choice you made in your budget? Why?'],['r2','Which card hurt your budget the most? How could you be ready for it next time?'],['r3','If you played again, what would you change? Why?']].map(([k,q])=>`<p class="rq">${q}</p><p class="ra">${esc(S.reflect[k]||'(no answer)').replace(/\n/g,'<br>')}</p>`).join('')}
      <p class="rsign">Teacher: ______________________ &nbsp;&nbsp; Score: ________</p></div>`;
}
const inClaude=()=>!!(window.claude&&window.claude.use);
const loadScript=src=>new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)) return res(); const t=document.createElement('script'); t.src=src; t.onload=res; t.onerror=rej; document.head.appendChild(t);});
function openReport(){
  const m=document.createElement('div'); m.className='modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.setAttribute('aria-label','Your full report');
  m.innerHTML=`<div class="mbar"><b>Your full report</b><span class="row" style="gap:8px"><span class="mfb" aria-live="polite"></span><button class="btn small" id="pdf" type="button">${ic('copy')} Save as PDF</button>${inClaude()?'':`<button class="btn small yellow" id="newtab" type="button">Open to print</button>`}<button class="btn small ghost" id="mclose" type="button">Close</button></span></div><div class="mscroll"><div class="sheet" id="sheet">${buildReport()}</div></div>`;
  document.body.appendChild(m); document.body.style.overflow='hidden';
  const close=()=>{m.remove(); document.body.style.overflow=''; $('#report')&&$('#report').focus();};
  m.querySelector('#mclose').onclick=close; m.addEventListener('keydown',e=>{if(e.key==='Escape') close();});
  m.querySelector('#mclose').focus();
  const fb=m.querySelector('.mfb'), btn=m.querySelector('#pdf');
  const nt=m.querySelector('#newtab'); if(nt) nt.onclick=()=>{
    const css=[...document.querySelectorAll('style')].map(x=>x.outerHTML).join('');
    const doc=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Month to Month Report - ${esc(S.name)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">${css}<style>html,body{background:#E7ECFA!important;margin:0;padding:0}.pt{max-width:780px;margin:16px auto;display:flex;gap:10px;align-items:center;font-family:Verdana,sans-serif;color:#141B30}.pt button{font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;border:3px solid #141B30;background:#22C47F;cursor:pointer}.sheet{margin:0 auto 40px}@media print{.pt{display:none}html,body{background:#fff!important}.sheet{box-shadow:none;padding:0;max-width:none}}</style></head><body><div class="pt"><button onclick="window.print()">Print or Save as PDF</button><span>In the print window, choose \u201CSave as PDF\u201D as the printer to save a copy.</span></div><div class="sheet">${m.querySelector('#sheet').innerHTML}</div></body></html>`;
    const w=window.open(URL.createObjectURL(new Blob([doc],{type:'text/html'})),'_blank');
    fb.textContent=w?'Opened in a new tab. Press Print there.':'Your browser blocked the new tab. Allow pop-ups and try again.';
  };
  btn.onclick=async()=>{
    btn.disabled=true; fb.textContent='Making your PDF\u2026';
    try{
      const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;

      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      const {jsPDF}=window.jspdf, pdf=new jsPDF({unit:'pt',format:'letter'}), PW=612, PH=792, M=36; let y=M;
      const sheet=m.querySelector('#sheet'); sheet.classList.add('capture');
      for(const sec of sheet.querySelectorAll('.rsec')){
        const cv=await html2canvas(sec,{scale:2,backgroundColor:'#ffffff',logging:false});
        const w=PW-2*M, h=cv.height*w/cv.width;
        if(y+h>PH-M&&y>M){pdf.addPage(); y=M;}
        pdf.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',M,y,w,Math.min(h,PH-2*M)); y+=h+14;
      }
      sheet.classList.remove('capture');
      const name=('Month-to-Month-'+S.name).replace(/[^A-Za-z0-9 _-]/g,'').replace(/\s+/g,'-');
      if(dl){ await dl.save({filename:name+'.pdf',data:pdf.output('blob')}); fb.textContent='Saved! Open the PDF to print it.'; }
      else { const a=document.createElement('a'); a.href=URL.createObjectURL(pdf.output('blob')); a.download=name+'.pdf'; document.body.appendChild(a); a.click(); a.remove();
        fb.textContent='Check your Downloads. If nothing saved, use \u201COpen to print.\u201D'; }
    }catch(e){
      fb.textContent=e&&e.code==='declined'?'Save canceled.':'Could not make the PDF. Try again.';
    }
    btn.disabled=false;
  };
}
SCREENS.results.bind=()=>{
  document.querySelectorAll('[data-r]').forEach(t=>t.oninput=()=>{S.reflect[t.dataset.r]=t.value; save();});
  $('#report').onclick=openReport;
  $('#again').onclick=()=>{const n=S.name; S=Object.assign(fresh(),{name:n,step:'path'}); render();};
  if(!S.confetti){S.confetti=true; save(); confetti();}
};

/* ---------- render ---------- */
function render(o){
  o=o||{};
  if(S.step!=='start') S._last=S.step;
  MQ={};
  const prevStep=render._step;
  drawBoard();
  const scr=$('#screen');
  scr.innerHTML=SCREENS[S.step]();
  (SCREENS[S.step].bind||(()=>{}))();
  save();
  if(flipNow){const f=$('#flip'); flipNow=null; if(f){ if(matchMedia('(prefers-reduced-motion: reduce)').matches){f.classList.add('flipped');} else { requestAnimationFrame(()=>{ f.classList.add('turning'); setTimeout(()=>{ f.classList.add('flipped'); f.classList.remove('turning'); },300); }); } }}
  if(prevStep!==S.step||render._month!==S.month||o.top){window.scrollTo({top:0}); scr.focus({preventScroll:true}); o.focusNext=false; o.keep=null;}
  if(o.keep){const k=document.querySelector(o.keep); if(k) k.focus({preventScroll:true});}
  else if(o.focusNext){const i=document.querySelector('.answer:not([disabled])')||document.querySelector('#yes,#nextm,#next,#draw'); if(i){ i.focus({preventScroll:true}); i.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}}
  render._step=S.step; render._month=S.month;
  stopSpeak();
}

/* delegated: check answers */
document.addEventListener('click',e=>{
  const c=e.target.closest('.check'); if(c){checkMQ(c.dataset.key); return;}
  const r=e.target.closest('[data-reveal]'); if(r){const k=r.dataset.reveal; S.helped[k]=true; S.solved[k]=MQ[k].answer; if(AFTER[k]) AFTER[k](); render({focusNext:true});}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('answer')){e.preventDefault(); checkMQ(e.target.closest('.mq').dataset.key);}});
let lastAnswer=null;
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('answer')) lastAnswer=e.target.id;});

/* ---------- read aloud ---------- */
const canSpeak='speechSynthesis' in window;
const readBtn=$('#t-read');
if(!canSpeak) readBtn.hidden=true;
function speak(t){try{speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=.95; u.onend=()=>readBtn.setAttribute('aria-pressed','false'); readBtn.setAttribute('aria-pressed','true'); speechSynthesis.speak(u);}catch(e){}}
function stopSpeak(){try{if(canSpeak) speechSynthesis.cancel(); readBtn.setAttribute('aria-pressed','false');}catch(e){}}
readBtn.onclick=()=>{if(readBtn.getAttribute('aria-pressed')==='true') stopSpeak(); else speak(READ);};

/* bigger text */
const bigBtn=$('#t-big');
try{if(localStorage.getItem(KEY+'-big')==='1'){document.documentElement.classList.add('big'); bigBtn.setAttribute('aria-pressed','true');}}catch(e){}
bigBtn.onclick=()=>{const on=document.documentElement.classList.toggle('big'); bigBtn.setAttribute('aria-pressed',String(on)); try{localStorage.setItem(KEY+'-big',on?'1':'0')}catch(e){}};

/* restart with in-page confirm */
const rs=$('#t-restart'); let rsT;
rs.onclick=()=>{if(rs.dataset.armed){clearTimeout(rsT); delete rs.dataset.armed; rs.textContent='Start over'; const n=S.name; S=fresh(); S.name=n; hadSave=false; render();} else {rs.dataset.armed='1'; rs.textContent='Tap again to erase game'; rsT=setTimeout(()=>{delete rs.dataset.armed; rs.textContent='Start over';},3500);}};

/* ---------- calculator ---------- */
const C={disp:'0',acc:null,op:null,fresh:true,ex:''};
const SYM={'+':'+','-':'\u2212','*':'\u00D7','/':'\u00F7'};
const num=s=>parseFloat(s);
const fmtC=n=>{if(!isFinite(n)) return 'Error'; n=Math.round(n*1e8)/1e8; return String(n);};
const calcOp=(a,b,o)=>o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:b===0?NaN:a/b;
function cpress(k){
  if(/^\d$/.test(k)){ if(C.fresh||C.disp==='0'){C.disp=k; C.fresh=false;} else if(C.disp.length<14) C.disp+=k; }
  else if(k==='.'){ if(C.fresh){C.disp='0.'; C.fresh=false;} else if(!C.disp.includes('.')) C.disp+='.'; }
  else if(k==='C'){ Object.assign(C,{disp:'0',acc:null,op:null,fresh:true,ex:''}); }
  else if(k==='back'){ if(!C.fresh){C.disp=C.disp.length>1?C.disp.slice(0,-1):'0'; if(C.disp==='-') C.disp='0';} }
  else if(k==='neg'){ if(C.disp!=='0') C.disp=C.disp.startsWith('-')?C.disp.slice(1):'-'+C.disp; }
  else if(SYM[k]){ if(C.op&&!C.fresh){C.acc=calcOp(C.acc,num(C.disp),C.op); C.disp=fmtC(C.acc);} else C.acc=num(C.disp); C.op=k; C.fresh=true; C.ex=fmtC(C.acc)+' '+SYM[k]; }
  else if(k==='='){ if(C.op!==null){const b=num(C.disp); const r=calcOp(C.acc,b,C.op); C.ex=fmtC(C.acc)+' '+SYM[C.op]+' '+fmtC(b)+' ='; C.disp=fmtC(r); C.acc=null; C.op=null; C.fresh=true;} }
  $('#calc-dv').textContent=C.disp.replace('-','\u2212'); $('#calc-ex').textContent=C.ex;
}
$('#keys').addEventListener('click',e=>{const b=e.target.closest('.key'); if(b) cpress(b.dataset.k);});
const calcEl=$('#calc'), fab=$('#calc-fab');
/* movable calculator */
const POSKEY=KEY+'-calcpos'; let calcPos=null;
try{calcPos=JSON.parse(localStorage.getItem(POSKEY)||'null');}catch(e){}
function placeCalc(x,y){
  const w=calcEl.offsetWidth, h=calcEl.offsetHeight, m=8;
  x=Math.min(Math.max(m,x),innerWidth-w-m); y=Math.min(Math.max(m,y),innerHeight-h-m);
  Object.assign(calcEl.style,{left:x+'px',top:y+'px',right:'auto',bottom:'auto'});
  calcPos={x,y};
}
const saveCalcPos=()=>{try{localStorage.setItem(POSKEY,JSON.stringify(calcPos))}catch(e){}};
const drag=$('#calc-drag'); let dx=0,dy=0,dragging=false;
drag.addEventListener('pointerdown',e=>{
  if(e.target.closest('#calc-x')) return;
  const r=calcEl.getBoundingClientRect(); dx=e.clientX-r.left; dy=e.clientY-r.top; dragging=true;
  placeCalc(r.left,r.top); calcEl.classList.add('dragging'); drag.setPointerCapture(e.pointerId); e.preventDefault();
});
drag.addEventListener('pointermove',e=>{if(dragging) placeCalc(e.clientX-dx,e.clientY-dy);});
const endDrag=()=>{if(!dragging) return; dragging=false; calcEl.classList.remove('dragging'); saveCalcPos();};
drag.addEventListener('pointerup',endDrag); drag.addEventListener('pointercancel',endDrag);
drag.addEventListener('keydown',e=>{
  const st={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key]; if(!st) return;
  e.preventDefault(); e.stopPropagation(); const r=calcEl.getBoundingClientRect(), s=e.shiftKey?60:20;
  placeCalc(r.left+st[0]*s,r.top+st[1]*s); saveCalcPos();
});
addEventListener('resize',()=>{if(calcPos&&!calcEl.hidden) placeCalc(calcPos.x,calcPos.y);});
const openCalc=v=>{calcEl.hidden=!v; fab.setAttribute('aria-expanded',String(v)); if(v){ if(calcPos) placeCalc(calcPos.x,calcPos.y); calcEl.querySelector('.key').focus();}};
fab.onclick=()=>openCalc(calcEl.hidden);
$('#calc-x').onclick=()=>{openCalc(false); fab.focus();};
calcEl.addEventListener('keydown',e=>{
  const map={Enter:'=','=':'=',Backspace:'back',Escape:'esc',Delete:'C',c:'C',C:'C'};
  let k=map[e.key]||e.key; if(e.key==='x') k='*';
  if(k==='esc'){openCalc(false); fab.focus(); return;}
  if(/^[\d.]$/.test(k)||SYM[k]||k==='='||k==='back'||k==='C'){e.preventDefault(); cpress(k);}
});
$('#calc-use').onclick=()=>{
  const el=(lastAnswer&&document.getElementById(lastAnswer)&&!document.getElementById(lastAnswer).disabled)?document.getElementById(lastAnswer):document.querySelector('.answer:not([disabled])');
  if(!el) return; let v=C.disp; const n=num(v); if(isFinite(n)&&Math.abs(n-Math.round(n))>0) v=String(Math.round(n*100)/100);
  el.value=v; el.focus();
};

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=$('#confetti'), x=cv.getContext('2d'); cv.hidden=false;
  const W=cv.width=innerWidth, H=cv.height=innerHeight;
  const cols=['#22C47F','#FFD23F','#FF6259','#4CC9F0','#A28CFF','#FF80B8'];
  const ps=Array.from({length:140},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*2.5,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.25,w:6+Math.random()*7,h:4+Math.random()*5,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,W,H); ps.forEach(p=>{p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore();});
    if(t-t0<4200) requestAnimationFrame(f); else {x.clearRect(0,0,W,H); cv.hidden=true;}})(t0);
}

/* boot: always open on the start screen so returning students see "Keep playing" */
if(S.step!=='start'){S._last=S.step; S.step='start';}
render();
/* ---------- splash: how to play (simple words, big pictures) ---------- */

  if(document.querySelector('.splash')) return;
  const steps=[['compass','var(--yellow)','Pick a path','Work, trade school, college or grad school'],
    ['bag','var(--sky)','Get a job','Flip a card. That is your job.'],
    ['calc','var(--green)','Do the math','Find your real paycheck. Use the calculator.'],
    ['home','var(--pink)','Make a budget','Spend less than you make.'],
    ['star','var(--violet)','Survive 12 months','Each month: 1 surprise card + 1 choice.']];
  const el=document.createElement('div'); el.className='splash'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-labelledby','sp-goal');
  el.innerHTML=`<div class="sp">
    <div class="sp-top"><div><p class="eyebrow">How to play \u00B7 30 seconds</p><h2 class="goal" id="sp-goal">Make it through <span>one whole year</span> without going broke.</h2></div>
      <button class="speak" id="sp-read" type="button">${ic('speaker')} Read to me</button></div>
    <ol class="sp-steps">${steps.map((x,i)=>`<li><span class="n" style="background:${x[1]}">${ic(x[0])}<b>${i+1}</b></span><div><strong>${x[2]}</strong><small>${x[3]}</small></div></li>`).join('')}</ol>
    <div class="sp-win"><b>You win with:</b><span class="w">${ic('piggy')} Savings</span><span class="w">${ic('card')} No debt</span><span class="w">${avatar(34,24)} A happy mood</span></div>
    <div class="sp-tips"><span>${ic('bulb')} Stuck on math? Tap <b>Show me how</b>.</span><span>${ic('calc')} Calculator is in the corner.</span></div>
    <div class="row end"><button class="btn" id="sp-go" type="button">Let's go ${ic('arrow',2.5)}</button></div>
  </div>`;
  document.body.appendChild(el); document.body.style.overflow='hidden';
  const close=()=>{stopSpeak(); el.remove(); document.body.style.overflow=''; try{localStorage.setItem(KEY+'-splash','1')}catch(e){} const n=document.getElementById('name'); if(n) n.focus();};
  el.querySelector('#sp-go').onclick=close;
  el.addEventListener('keydown',e=>{if(e.key==='Escape') close();});
  el.addEventListener('click',e=>{if(e.target===el) close();});
  el.querySelector('#sp-read').onclick=()=>speak('How to play. Your goal: make it through one whole year without going broke. Step 1, pick a path: work, trade school, college or grad school. Step 2, get a job. Flip a card, that is your job. Step 3, do the math. Find your real paycheck. Use the calculator. Step 4, make a budget. Spend less than you make. Step 5, survive 12 months. Each month you get one surprise card and one choice. You win with savings, no debt, and a happy mood. Stuck on math? Tap show me how.');
  el.querySelector('#sp-go').focus({preventScroll:true}); el.scrollTop=0;
}
$('#t-help').onclick=openSplash;
let splashSeen=false; try{splashSeen=localStorage.getItem(KEY+'-splash')==='1';}catch(e){}
if(!splashSeen) openSplash();
})();
